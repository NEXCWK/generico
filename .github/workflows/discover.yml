name: Discover data sources (manual, debug only)

on:
  workflow_dispatch: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python -m playwright install --with-deps chromium

      - name: Discover Reportei API
        env:
          REPORTEI_API_TOKEN: ${{ secrets.REPORTEI_API_TOKEN }}
        run: python scripts/discover_reportei.py
        continue-on-error: true

      - name: Discover Reportei dashboard network calls
        run: python scripts/discover_reportei_dashboard.py
        continue-on-error: true

      - name: Discover nexpainel
        env:
          NEXPAINEL_EMAIL: ${{ secrets.NEXPAINEL_EMAIL }}
          NEXPAINEL_PASSWORD: ${{ secrets.NEXPAINEL_PASSWORD }}
        run: python scripts/discover_nexpainel.py
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: discover-output
          path: discover_output/
          retention-days: 7
